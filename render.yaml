services:
  - type: web
    name: project-garden
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_PATH
        value: /var/data/garden.db
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
    disk:
      name: garden-data
      mountPath: /var/data
      sizeGB: 1
